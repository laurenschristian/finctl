version: 2
project_name: finctl
before:
  hooks:
    - go mod tidy
    - go run ./tools/gendocs
    - sh scripts/completions.sh
builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
universal_binaries:
  - replace: true
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - man/*
      - completions/*
checksum:
  name_template: checksums.txt
changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.*$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.*$'
      order: 1
    - title: Others
      order: 999
homebrew_casks:
  - name: finctl
    repository:
      owner: laurenschristian
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/laurenschristian/finctl"
    description: "CLI and MCP server for personal finance"
    license: "MIT"
    manpages:
      - "man/finctl.1"
    completions:
      bash: "completions/finctl.bash"
      zsh: "completions/_finctl"
      fish: "completions/finctl.fish"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/finctl"]
          end
